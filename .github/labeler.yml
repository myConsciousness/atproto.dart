# Package-specific labels.
#
# The list below must cover every member of the root `pubspec.yaml` `workspace:`
# list, plus `packages/bluesky_text_flutter` (a Flutter package that is not a
# workspace member). This file is read by actions/labeler, so unlike the test
# workflow it cannot derive the list at runtime -- adding a workspace member
# means adding a rule here and a color in `.github/labels.yml`. It drifted once
# already and left `atproto_identity` and `templates/feed_generator` unlabelled.
at_primitives:
- changed-files:
  - any-glob-to-any-file: packages/at_primitives/**
lexicon:
- changed-files:
  - any-glob-to-any-file: packages/lexicon/**
xrpc:
- changed-files:
  - any-glob-to-any-file: packages/xrpc/**
multiformats:
- changed-files:
  - any-glob-to-any-file: packages/multiformats/**
atproto_test:
- changed-files:
  - any-glob-to-any-file: packages/atproto_test/**
atproto_oauth:
- changed-files:
  - any-glob-to-any-file: packages/atproto_oauth/**
atproto_core:
- changed-files:
  - any-glob-to-any-file: packages/atproto_core/**
lex_gen:
- changed-files:
  - any-glob-to-any-file: packages/lex_gen/**
did_plc:
- changed-files:
  - any-glob-to-any-file: packages/did_plc/**
atproto:
- changed-files:
  - any-glob-to-any-file: packages/atproto/**
atproto_identity:
- changed-files:
  - any-glob-to-any-file: packages/atproto_identity/**
bluesky_text:
- changed-files:
  - any-glob-to-any-file: packages/bluesky_text/**
bluesky_text_flutter:
- changed-files:
  - any-glob-to-any-file: packages/bluesky_text_flutter/**
bluesky:
- changed-files:
  - any-glob-to-any-file: packages/bluesky/**
bluesky_cli:
- changed-files:
  - any-glob-to-any-file: packages/bluesky_cli/**

# Workspace members outside `packages/`.
feed_generator:
- changed-files:
  - any-glob-to-any-file: templates/feed_generator/**

# Test-related changes
test:
- changed-files:
  - any-glob-to-any-file:
    - packages/*/test/**/*.dart
    - templates/*/test/**/*.dart

# Documentation changes
documentation:
- changed-files:
  - any-glob-to-any-file:
    - packages/*/CHANGELOG.md
    - packages/*/README.md
    - templates/*/CHANGELOG.md
    - templates/*/README.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - README.md

# CI/CD and tooling
ci:
- changed-files:
  - any-glob-to-any-file:
    - .github/workflows/**
    - .github/labeler.yml
    - .github/labels.yml
    - .github/dependabot.yml
    - melos.yaml
    - pubspec.yaml
    - pubspec_overrides.yaml
    - analysis_options.yaml

# Build and development tools
build:
- changed-files:
  - any-glob-to-any-file:
    - scripts/**
    - packages/*/pubspec.yaml
    - packages/*/analysis_options.yaml
    - templates/*/pubspec.yaml
    - templates/*/analysis_options.yaml
